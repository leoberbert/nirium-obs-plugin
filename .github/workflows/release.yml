name: Release

# Gera o instalador (.exe) e o pacote portátil (.zip) do plugin para Windows x64.
#   - git tag v0.1.0 && git push origin v0.1.0   -> compila e publica a release
#   - Actions > Release > Run workflow             -> compila e guarda os arquivos como artefatos

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Versão do OBS Studio usada para os cabeçalhos e DLLs (veja scripts/fetch-windows-deps.ps1).
  OBS_VERSION: "32.2.2"

jobs:
  windows:
    name: Instalador e pacote portátil (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versão
        id: ver
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0-dev' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Baixar o OBS Studio (só as DLLs, para gerar as bibliotecas de importação)
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/obsproject/obs-studio/releases/download/$env:OBS_VERSION/OBS-Studio-$env:OBS_VERSION-Windows-x64.zip" -OutFile obs.zip
          Expand-Archive obs.zip -DestinationPath obs

      - name: Preparar cabeçalhos e bibliotecas
        shell: pwsh
        run: ./scripts/fetch-windows-deps.ps1 -ObsDir "$PWD\obs" -ObsTag $env:OBS_VERSION -OutDir "$PWD\deps"

      - name: Compilar e testar
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DNIRIUN_DEPS_DIR="$PWD\deps"
          cmake --build build --config RelWithDebInfo
          ctest --test-dir build -C RelWithDebInfo --output-on-failure
          cmake --install build --config RelWithDebInfo --prefix dist

      - name: Pacote portátil (.zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-installer | Out-Null
          Copy-Item LICENSE, README.md dist\
          Compress-Archive -Path dist\* -DestinationPath "dist-installer\niriun-obs-${{ steps.ver.outputs.version }}-windows-x64-portable.zip"

      - name: Instalador (.exe, Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue)?.Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer\niriun-obs.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falhou" }

      - uses: actions/upload-artifact@v4
        with:
          name: niriun-obs-windows-x64
          path: dist-installer/*

      - name: Publicar a release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-installer/*
          generate_release_notes: true
