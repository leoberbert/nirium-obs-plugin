name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # OBS Studio release whose DLLs and headers the plugin is built against (see scripts/fetch-windows-deps.ps1).
  OBS_VERSION: "32.2.2"

jobs:
  protocol-tests:
    name: Protocol unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DNIRIUN_BUILD_PLUGIN=OFF
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows x64 plugin
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download OBS Studio (only its DLLs are used, to make import libraries)
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/obsproject/obs-studio/releases/download/$env:OBS_VERSION/OBS-Studio-$env:OBS_VERSION-Windows-x64.zip" -OutFile obs.zip
          Expand-Archive obs.zip -DestinationPath obs

      - name: Prepare headers and import libraries
        shell: pwsh
        run: ./scripts/fetch-windows-deps.ps1 -ObsDir "$PWD\obs" -ObsTag $env:OBS_VERSION -OutDir "$PWD\deps"

      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DNIRIUN_DEPS_DIR="$PWD\deps"
          cmake --build build --config RelWithDebInfo
          ctest --test-dir build -C RelWithDebInfo --output-on-failure

      - name: Package
        shell: pwsh
        run: cmake --install build --config RelWithDebInfo --prefix dist

      - uses: actions/upload-artifact@v4
        with:
          name: niriun-obs-windows-x64
          path: dist
